<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FroFroKit - Arcade & Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a2e;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .top-nav {
            background: #16213e;
            border-bottom: 4px solid #0f3460;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 50;
        }

        .nav-logo { color: #e94560; font-size: 10px; text-shadow: 2px 2px #000; cursor: pointer; }

        .nav-btn {
            background: #0f3460;
            border-bottom: 4px solid #000;
            padding: 6px 10px;
            font-size: 7px;
            border-radius: 4px;
            transition: all 0.1s;
        }
        .nav-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
        .nav-btn.special { background: #e94560; border-bottom-color: #950740; }

        .pixel-btn {
            background: #0f3460;
            border-radius: 8px;
            border-bottom: 6px solid #000;
            padding: 15px;
            transition: all 0.1s;
            font-size: 10px;
            width: 100%;
            margin-bottom: 10px;
            display: block;
        }
        .pixel-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .pixel-btn.locked { opacity: 0.5; filter: grayscale(1); }

        #game-canvas {
            image-rendering: pixelated;
            background: #000;
            width: 100%;
            max-width: 400px;
            height: 500px;
            border: 4px solid #0f3460;
            display: block;
            margin: 0 auto;
        }

        .modal-container {
            background: rgba(0,0,0,0.9);
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .touch-ctrl {
            display: none;
            position: fixed;
            bottom: 30px;
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 60;
        }
        .ctrl-btn {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #dash-iframe {
            width: 100%;
            height: 75vh;
            border: none;
            background: #fff;
            border-radius: 10px;
        }

        .blook-item {
            background: #fff;
            color: #000;
            border-radius: 8px;
            padding: 10px;
            font-size: 20px;
            text-align: center;
            cursor: pointer;
            border-bottom: 4px solid #ccc;
        }
        .blook-item.selected { border: 4px solid #e94560; background: #ffdada; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen pt-16">

    <nav class="top-nav">
        <div class="flex items-center gap-2">
            <span class="nav-logo" onclick="adminClick()">FROFRO</span>
            <button onclick="showModal('market')" class="nav-btn">MARKET</button>
            <button onclick="showModal('locker')" class="nav-btn">LOCKER</button>
            <button onclick="showModal('more')" id="more-nav-btn" class="nav-btn special">MORE</button>
            <button onclick="showModal('dash')" class="nav-btn">DASH</button>
        </div>
        <div class="text-right">
            <div class="text-[8px]">💰 <span id="coin-count">0</span></div>
        </div>
    </nav>

    <!-- Main Menu -->
    <div id="menu-screen" class="text-center w-full max-w-lg px-6">
        <h1 class="text-xl mb-8" style="color:#e94560; text-shadow: 2px 2px #000;">GAME HUB</h1>
        <button onclick="startGame('racer')" class="pixel-btn" style="background:#ef4444">RETRO RACER</button>
        <button onclick="startGame('void')" id="btn-void" class="pixel-btn locked" style="background:#8b5cf6">VOID STRIKE (CORE)</button>
        <button onclick="startGame('flappy')" class="pixel-btn" style="background:#3b82f6">FROPPY BIRD</button>
        <button onclick="startGame('craft')" class="pixel-btn" style="background:#10b981">FROFRO CRAFT</button>
        <button onclick="startGame('dash-game')" class="pixel-btn" style="background:#f59e0b">FROFRO DASH</button>
    </div>

    <!-- More Menu (Subscribers) -->
    <div id="more-modal" class="modal-container hidden">
        <div class="bg-[#16213e] p-6 rounded-2xl border-4 border-white w-full max-w-md relative text-center">
            <button onclick="closeModals()" class="absolute top-2 right-2 text-white">X</button>
            <h2 class="text-sm mb-6 text-pink-500">SUBSCRIPTIONS</h2>
            
            <div id="core-buy-area" class="mb-4 p-4 border border-blue-400 rounded">
                <p class="text-[8px] mb-2">CORE: Unlock Void Strike + Void Pack</p>
                <button onclick="buySub('core', 1000)" class="nav-btn w-full py-3" id="core-btn-label">BUY CORE (1000💰)</button>
            </div>

            <div id="elite-buy-area" class="p-4 border border-yellow-400 rounded">
                <p class="text-[8px] mb-2 text-yellow-400">ELITE: Custom Skins + All Core Perks</p>
                <button onclick="buySub('elite', 1700)" class="nav-btn w-full py-3" id="elite-btn-label">BUY ELITE (1700💰)</button>
                <div id="elite-maker" class="hidden mt-4">
                    <input type="text" id="skin-input" placeholder="Emoji" maxlength="2" class="bg-black border p-2 text-center w-20 mb-2">
                    <button onclick="makeSkin()" class="nav-btn w-full">SET CUSTOM SKIN</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Dash Iframe -->
    <div id="dash-modal" class="modal-container hidden">
        <div class="w-[95%] max-w-3xl relative">
            <button onclick="closeModals()" class="absolute -top-12 right-0 bg-red-600 px-4 py-2 rounded text-[8px]">CLOSE DASH</button>
            <iframe id="dash-iframe" src="https://frofrocreater.github.io/FroFroChat/"></iframe>
        </div>
    </div>

    <!-- Locker & Market (Simplified) -->
    <div id="locker-modal" class="modal-container hidden">
        <div class="bg-[#16213e] p-6 rounded-xl w-full max-w-md max-h-[80vh] overflow-y-auto">
            <h2 class="text-sm mb-4 text-center">LOCKER</h2>
            <div id="locker-grid" class="grid grid-cols-4 gap-2"></div>
            <button onclick="closeModals()" class="pixel-btn mt-4 py-2">CLOSE</button>
        </div>
    </div>

    <div id="market-modal" class="modal-container hidden">
        <div class="bg-[#16213e] p-6 rounded-xl w-full max-w-md">
            <h2 class="text-sm mb-4 text-center">MARKET</h2>
            <div class="space-y-4">
                <div class="p-4 border border-blue-500 rounded flex justify-between items-center">
                    <span class="text-[8px]">Starter Pack (10💰)</span>
                    <button onclick="buyPack(10, ['🐶','🐱','🐭','🐹'])" class="nav-btn">OPEN</button>
                </div>
                <div class="p-4 border border-green-500 rounded flex justify-between items-center">
                    <span class="text-[8px]">Nature Pack (50💰)</span>
                    <button onclick="buyPack(50, ['🌲','🌵','🌻','🍄'])" class="nav-btn">OPEN</button>
                </div>
            </div>
            <button onclick="closeModals()" class="pixel-btn mt-4 py-2">CLOSE</button>
        </div>
    </div>

    <!-- Game View -->
    <div id="game-container" class="hidden relative w-full max-w-[400px]">
        <div class="flex justify-between items-center px-2 py-2 text-[8px] bg-[#16213e] rounded-t-lg border-x-4 border-t-4 border-[#0f3460]">
            <button onclick="exitGame()" class="bg-red-600 px-2 py-1 rounded">EXIT</button>
            <div>SCORE: <span id="score-val">0</span></div>
            <div id="player-skin">🔴</div>
        </div>
        <canvas id="game-canvas" width="400" height="500"></canvas>
    </div>

    <!-- Death Question Overlay -->
    <div id="death-overlay" class="modal-container hidden">
        <div class="bg-[#16213e] p-8 rounded-2xl border-4 border-red-500 w-full max-w-sm text-center">
            <h2 class="text-red-500 text-lg mb-4">YOU DIED!</h2>
            <p class="text-[8px] mb-6">Answer correctly to REVIVE!</p>
            <div id="q-text" class="text-[10px] mb-6 leading-relaxed"></div>
            <div id="q-options" class="grid grid-cols-1 gap-3"></div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="touch-controls" class="touch-ctrl">
        <div class="flex gap-4">
            <button class="ctrl-btn" id="btn-left">⬅️</button>
            <button class="ctrl-btn" id="btn-right">➡️</button>
        </div>
        <button class="ctrl-btn" id="btn-up">🚀</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let player = {
            coins: 50,
            unlocked: ['🔴'],
            selected: '🔴',
            isCore: false,
            isElite: false
        };

        let game = {
            active: false,
            mode: '',
            score: 0,
            px: 200, py: 400,
            vx: 0, vy: 0,
            frame: 0,
            entities: [],
            hasRevived: false,
            input: { left: false, right: false, up: false }
        };

        const questions = [
            { q: "What is 15 + 27?", a: ["42", "32", "52"], c: 0 },
            { q: "Which planet is the Red Planet?", a: ["Venus", "Mars", "Jupiter"], c: 1 },
            { q: "What is the capital of France?", a: ["London", "Berlin", "Paris"], c: 2 },
            { q: "How many legs does a spider have?", a: ["6", "8", "10"], c: 1 },
            { q: "What is 100 / 4?", a: ["20", "25", "30"], c: 1 }
        ];

        window.onload = () => {
            const saved = localStorage.getItem('frofro_save');
            if (saved) { player = JSON.parse(saved); }
            updateUI();
        };

        function updateUI() {
            document.getElementById('coin-count').innerText = player.coins;
            document.getElementById('player-skin').innerText = player.selected;
            if (player.isCore || player.isElite) {
                document.getElementById('btn-void').classList.remove('locked');
                document.getElementById('core-btn-label').innerText = "OWNED";
            }
            if (player.isElite) {
                document.getElementById('elite-btn-label').innerText = "OWNED";
                document.getElementById('elite-maker').classList.remove('hidden');
            }
            localStorage.setItem('frofro_save', JSON.stringify(player));
        }

        function showModal(id) {
            closeModals();
            document.getElementById(id + '-modal').classList.remove('hidden');
            if (id === 'locker') renderLocker();
        }

        function closeModals() {
            document.querySelectorAll('.modal-container').forEach(m => m.classList.add('hidden'));
        }

        function buySub(type, cost) {
            if (player.coins >= cost) {
                player.coins -= cost;
                if (type === 'core') player.isCore = true;
                if (type === 'elite') { player.isElite = true; player.isCore = true; }
                updateUI();
                alert(`Upgraded to ${type}!`);
            } else { alert("Not enough coins!"); }
        }

        function makeSkin() {
            const val = document.getElementById('skin-input').value;
            if (val) {
                player.selected = val;
                if (!player.unlocked.includes(val)) player.unlocked.push(val);
                updateUI();
                alert("Skin Applied!");
            }
        }

        function buyPack(cost, items) {
            if (player.coins >= cost) {
                player.coins -= cost;
                const item = items[Math.floor(Math.random() * items.length)];
                if (!player.unlocked.includes(item)) player.unlocked.push(item);
                updateUI();
                alert("Got: " + item);
            }
        }

        function renderLocker() {
            const grid = document.getElementById('locker-grid');
            grid.innerHTML = '';
            player.unlocked.forEach(item => {
                const div = document.createElement('div');
                div.className = `blook-item ${player.selected === item ? 'selected' : ''}`;
                div.innerText = item;
                div.onclick = () => { player.selected = item; updateUI(); renderLocker(); };
                grid.appendChild(div);
            });
        }

        function startGame(mode) {
            if (mode === 'void' && !player.isCore) return showModal('more');
            
            game = {
                active: true, mode, score: 0, frame: 0,
                px: 200, py: 400, vx: 0, vy: 0,
                entities: [], hasRevived: false,
                input: { left: false, right: false, up: false }
            };
            
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('touch-controls').style.display = 'flex';
            
            if (mode === 'flappy') game.py = 250;
            if (mode === 'racer') game.px = 200;

            requestAnimationFrame(loop);
        }

        function exitGame() { location.reload(); }

        function loop() {
            if (!game.active) return;
            ctx.clearRect(0, 0, 400, 500);
            document.getElementById('score-val').innerText = game.score;

            // Shared Input
            if (game.input.left) game.px = Math.max(30, game.px - 7);
            if (game.input.right) game.px = Math.min(370, game.px + 7);

            switch(game.mode) {
                case 'racer': updateRacer(); break;
                case 'flappy': updateFlappy(); break;
                case 'dash-game': updateDash(); break;
                case 'void': updateVoid(); break;
                case 'craft': updateCraft(); break;
            }

            game.frame++;
            requestAnimationFrame(loop);
        }

        function updateRacer() {
            // Background road
            ctx.fillStyle = "#333"; ctx.fillRect(50, 0, 300, 500);
            ctx.strokeStyle = "#fff"; ctx.setLineDash([20, 20]);
            ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, 500); ctx.stroke();
            
            if (game.frame % 35 === 0) game.entities.push({ x: 75 + Math.random() * 250, y: -50, type: 'car' });
            
            game.entities.forEach((e, i) => {
                e.y += 8;
                ctx.fillStyle = "#ff0000"; ctx.fillRect(e.x - 20, e.y - 20, 40, 40);
                if (Math.abs(e.x - game.px) < 35 && Math.abs(e.y - 400) < 35) triggerDeath();
                if (e.y > 550) { game.entities.splice(i, 1); game.score++; }
            });
            drawPlayer(game.px, 400);
        }

        function updateFlappy() {
            game.vy += 0.4; game.py += game.vy;
            if (game.input.up) { game.vy = -7; game.input.up = false; }
            
            if (game.frame % 80 === 0) game.entities.push({ x: 400, gap: 120, top: 50 + Math.random() * 250 });
            
            game.entities.forEach((p, i) => {
                p.x -= 4;
                ctx.fillStyle = "#10b981";
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.fillRect(p.x, p.top + p.gap, 50, 500);
                if (p.x < 100 && p.x > 30 && (game.py < p.top || game.py > p.top + p.gap)) triggerDeath();
                if (p.x === 52) game.score++;
                if (p.x < -60) game.entities.splice(i, 1);
            });
            if (game.py > 500 || game.py < 0) triggerDeath();
            drawPlayer(80, game.py);
        }

        function updateDash() {
            if (game.frame % 20 === 0) game.entities.push({ x: Math.random() * 400, y: -20 });
            game.entities.forEach((o, i) => {
                o.y += 6;
                ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(o.x, o.y, 10, 0, Math.PI*2); ctx.fill();
                if (Math.abs(o.x - game.px) < 25 && Math.abs(o.y - 450) < 25) triggerDeath();
                if (o.y > 520) { game.entities.splice(i, 1); game.score++; }
            });
            drawPlayer(game.px, 450);
        }

        function updateVoid() {
            if (game.frame % 30 === 0) game.entities.push({ x: Math.random() * 400, y: -20 });
            ctx.fillStyle = "#111"; ctx.fillRect(0,0,400,500);
            game.entities.forEach((a, i) => {
                a.y += 4; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(a.x, a.y, 15, 0, Math.PI*2); ctx.fill();
                if (a.y > 500) triggerDeath();
            });
            drawPlayer(game.px, 460);
        }

        function updateCraft() {
            ctx.fillStyle = "#87ceeb"; ctx.fillRect(0,0,400,350);
            ctx.fillStyle = "#228b22"; ctx.fillRect(0,350,400,150);
            if (game.frame % 60 === 0) game.entities.push({ x: 420, y: 320 });
            game.entities.forEach((e, i) => {
                e.x -= 5; ctx.fillStyle = "#8b4513"; ctx.fillRect(e.x, e.y, 30, 30);
                if (Math.abs(e.x - 100) < 30 && Math.abs(320 - game.py) < 30) triggerDeath();
                if (e.x < -40) { game.entities.splice(i, 1); game.score++; }
            });
            game.vy += 0.8; game.py += game.vy;
            if (game.py > 320) { game.py = 320; game.vy = 0; }
            if (game.input.up && game.py === 320) { game.vy = -12; game.input.up = false; }
            drawPlayer(100, game.py);
        }

        function drawPlayer(x, y) {
            ctx.font = "30px Arial"; ctx.textAlign = "center";
            ctx.fillText(player.selected, x, y);
        }

        function triggerDeath() {
            if (game.hasRevived) {
                gameOver();
            } else {
                game.active = false;
                showQuestion();
            }
        }

        function showQuestion() {
            const q = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('death-overlay').classList.remove('hidden');
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = '';
            q.a.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "nav-btn py-3 text-[10px]";
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === q.c) {
                        game.hasRevived = true;
                        game.active = true;
                        game.entities = [];
                        document.getElementById('death-overlay').classList.add('hidden');
                        requestAnimationFrame(loop);
                    } else {
                        gameOver();
                    }
                };
                container.appendChild(btn);
            });
        }

        function gameOver() {
            game.active = false;
            document.getElementById('death-overlay').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('touch-controls').style.display = 'none';
            let earned = Math.floor(game.score / 2);
            player.coins += earned;
            updateUI();
            alert(`Game Over! Score: ${game.score} | Earned: ${earned} coins.`);
        }

        // --- Controls ---
        const setKey = (k, v) => {
            if (k === 'ArrowLeft' || k === 'KeyA') game.input.left = v;
            if (k === 'ArrowRight' || k === 'KeyD') game.input.right = v;
            if ((k === 'Space' || k === 'ArrowUp') && v) game.input.up = true;
        };
        window.onkeydown = (e) => setKey(e.code, true);
        window.onkeyup = (e) => setKey(e.code, false);

        document.getElementById('btn-left').onpointerdown = () => game.input.left = true;
        document.getElementById('btn-left').onpointerup = () => game.input.left = false;
        document.getElementById('btn-right').onpointerdown = () => game.input.right = true;
        document.getElementById('btn-right').onpointerup = () => game.input.right = false;
        document.getElementById('btn-up').onpointerdown = () => game.input.up = true;
        document.getElementById('btn-up').onpointerup = () => game.input.up = false;

        function adminClick() { player.coins += 500; updateUI(); }
    </script>
</body>
</html>
